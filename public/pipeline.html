<section id="today-agenda" class="panel"><div class="row"><h2>今日やること</h2><button id="agendaRefresh" type="button" disabled>Attio全案件を確認</button></div><p id="agendaStatus" role="status"></p><div id="agendaRows"></div></section><section class="panel"><div class="row"><div><h2>工程別の案件一覧</h2><p id="boardSummary" class="muted">接続後にAttioの案件を表示します。</p></div><button id="boardRefresh" class="primary" disabled>案件を更新</button></div><div class="toolbar"><div><label for="boardSearch">案件名で検索</label><input id="boardSearch" type="search" placeholder="案件名を入力"></div><div><label for="boardOwner">担当者で絞り込み</label><select id="boardOwner"><option value="">すべての担当者</option></select></div></div><p id="boardNotice" class="muted" role="status">接続前は工程の流れだけを表示しています。</p><p id="error" role="alert"></p><p id="status" class="muted" role="status"></p></section>

</main><script>
'use strict';
const local=document.documentElement.dataset.local==='1',csrf='LOCAL_CSRF_PLACEHOLDER';
const $=id=>document.getElementById(id);
let selected=null,messageId=null,conversationVersion=null,busy=false,bridgeToken=null;
function controls(){ $('boardRefresh').disabled=busy||(!local&&$('connected').classList.contains('hidden'));$('boardMore').disabled=busy; }
function showConnected(){ $('connected').classList.remove('hidden');$('setup').classList.add('hidden'); }
async function request(path,body){if(!local)throw new Error('先にログインしてMacを選択してください。');busy=true;controls();try{const response=await fetch('/api/'+path,{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error||'接続に失敗しました。');return data;}finally{busy=false;controls();}}
if(local){showConnected();controls();}
</script><script src="/cloud.js?v=keep-login"></script><script src="/pipeline.js?v=tokyo"></script><script src="/marked.umd.js"></script><script src="/note-editor.js?v=1"></script><script src="/directory.js?v=tokyo"></script><script src="/followups.js?v=tokyo"></script></body></html>
